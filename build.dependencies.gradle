repositories {
    mavenCentral()
    google()// Needed for androidx
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.0'
    implementation 'org.firstinspires.ftc:Blocks:11.2.0'
    implementation 'org.firstinspires.ftc:RobotCore:11.2.0'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.0'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.0'
    implementation 'org.firstinspires.ftc:Hardware:11.2.0'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.0'
    implementation 'org.firstinspires.ftc:Vision:11.2.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.pedropathing:ftc:2.1.1'
    implementation 'com.pedropathing:telemetry:1.0.0'


    //implementation 'com.bylazar:fullpanels:1.0.9'
    implementation 'com.bylazar.sloth:fullpanels:0.2.4+1.0.12'
    implementation 'dev.nextftc:ftc:1.0.1'
    implementation 'dev.nextftc:hardware:1.0.1' // If you would like to use the hardware module
    implementation 'dev.nextftc:control:1.0.0'
    implementation 'dev.nextftc.extensions:pedro:1.0.0'

    implementation 'dev.frozenmilk.sinister:Sloth:0.2.4'
}

